name: Deploy ALiSiO PMS

on:
  push:
    branches: [main]

# Prevent parallel deploys: if a new push arrives while deploying,
# wait for the current deploy to finish (cancel-in-progress: false).
# Change to true if you prefer "cancel old, start fresh" behaviour.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        env:
          # Forward GitHub Secrets that the remote shell needs. To add a new
          # key: define it in repo Settings → Secrets → Actions, list it
          # here, list its name in the `envs:` field below, and append the
          # idempotent .env-sync block at the bottom of the script.
          PRICELABS_API_KEY: ${{ secrets.PRICELABS_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: PRICELABS_API_KEY
          script: |
            set -euo pipefail

            cd /root/projects/alisio-pms

            PREVIOUS_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "")
            echo "Previous commit: $PREVIOUS_COMMIT"

            # Pull latest code
            if [ ! -d ".git" ]; then
              cd ..
              rm -rf alisio-pms
              git clone git@github.com:oleshka07/ALiSiO-Hotel-PMS.git alisio-pms
              cd alisio-pms
            else
              git fetch origin
              git reset --hard origin/main
            fi

            NEW_COMMIT=$(git rev-parse HEAD)
            echo "New commit:      $NEW_COMMIT"

            # Ensure data dir exists (DB lives here, excluded from git)
            mkdir -p data

            # Install dependencies
            npm ci --production=false

            # Safe stale-lock cleanup: only remove .next/lock if the PID
            # recorded in it is no longer running (i.e. previous build crashed).
            # This avoids killing a legitimate parallel build.
            if [ -f .next/lock ]; then
              LOCK_PID=$(cat .next/lock 2>/dev/null || echo "")
              if [ -n "$LOCK_PID" ] && ! kill -0 "$LOCK_PID" 2>/dev/null; then
                echo "Removing stale .next/lock (PID $LOCK_PID is gone)"
                rm -f .next/lock
              elif [ -z "$LOCK_PID" ]; then
                echo "Removing empty .next/lock"
                rm -f .next/lock
              else
                echo ".next/lock is held by running PID $LOCK_PID — waiting..."
              fi
            fi

            # Build Next.js
            if ! npm run build; then
              echo "Build failed — aborting deploy. Live service untouched."
              if [ -n "$PREVIOUS_COMMIT" ]; then
                echo "Rolling working tree back to $PREVIOUS_COMMIT"
                git reset --hard "$PREVIOUS_COMMIT"
              fi
              exit 1
            fi

            # ─────────────────────────────────────────────────────────
            # Idempotent VPS setup for the bank-inbox cron endpoint
            # (PR #63). The endpoint /api/cron/poll-bank-inboxes
            # authenticates via process.env.CRON_SECRET. Generate
            # once + install crontab + create log file. All steps are
            # no-ops on subsequent runs.
            # ─────────────────────────────────────────────────────────
            if ! grep -q '^CRON_SECRET=' .env 2>/dev/null; then
              SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
              echo "CRON_SECRET=$SECRET" >> .env
              echo "[setup] generated CRON_SECRET and appended to .env"
            else
              echo "[setup] CRON_SECRET already present in .env"
            fi

            # ─────────────────────────────────────────────────────────
            # Sync PRICELABS_API_KEY from GitHub Secrets into .env.
            # Idempotent: appends on first run, overwrites in place
            # afterwards. The `[ -n ... ]` guard avoids writing an empty
            # line when the secret is unset in the GitHub repo.
            # ─────────────────────────────────────────────────────────
            if [ -n "${PRICELABS_API_KEY:-}" ]; then
              if grep -q '^PRICELABS_API_KEY=' .env 2>/dev/null; then
                sed -i "s|^PRICELABS_API_KEY=.*|PRICELABS_API_KEY=${PRICELABS_API_KEY}|" .env
                echo "[setup] PRICELABS_API_KEY refreshed in .env"
              else
                echo "PRICELABS_API_KEY=${PRICELABS_API_KEY}" >> .env
                echo "[setup] PRICELABS_API_KEY appended to .env"
              fi
            else
              echo "[setup] PRICELABS_API_KEY not set in GitHub Secrets — skipping"
            fi

            # Ensure the log file exists with the right perms so cron
            # output has somewhere to land.
            touch /var/log/pms-cron-bank.log
            chmod 644 /var/log/pms-cron-bank.log

            # Crontab entries — Node listens on port 3001 in production
            # (see ical-sync cron already on :3001). Use replace-not-
            # append: strip any old entry pointing at the wrong port,
            # then reinstall with the right one. Fully idempotent.
            POLL_CRON='*/15 * * * * curl -fsS -X POST -H "X-Cron-Secret: $(grep ^CRON_SECRET /root/projects/alisio-pms/.env | cut -d= -f2)" http://localhost:3001/api/cron/poll-bank-inboxes >> /var/log/pms-cron-bank.log 2>&1'
            ( crontab -l 2>/dev/null | grep -v 'poll-bank-inboxes' || true
              echo "$POLL_CRON"
            ) | crontab -
            echo "[setup] crontab poll-bank-inboxes refreshed (port 3001)"

            # Daily PriceLabs → price_calendar sync. 04:00 lets ČNB publish
            # the day's EUR/CZK rate first; PriceLabs refreshes overnight.
            touch /var/log/pms-cron-pricelabs.log
            chmod 644 /var/log/pms-cron-pricelabs.log
            PRICELABS_CRON='0 4 * * * curl -fsS -X POST -H "X-Cron-Secret: $(grep ^CRON_SECRET /root/projects/alisio-pms/.env | cut -d= -f2)" http://localhost:3001/api/cron/sync-pricelabs >> /var/log/pms-cron-pricelabs.log 2>&1'
            ( crontab -l 2>/dev/null | grep -v 'sync-pricelabs' || true
              echo "$PRICELABS_CRON"
            ) | crontab -
            echo "[setup] crontab sync-pricelabs refreshed (port 3001)"

            # Truncate the cron log if it grew because of port-3000
            # connection-refused noise (PR #94 diagnostic showed 395
            # lines of "curl: (7) Failed to connect"). One-off cleanup.
            if [ -f /var/log/pms-cron-bank.log ] && grep -q 'port 3000' /var/log/pms-cron-bank.log; then
              : > /var/log/pms-cron-bank.log
              echo "[setup] truncated /var/log/pms-cron-bank.log (was full of port-3000 noise)"
            fi

            # ─────────────────────────────────────────────────────────
            # One-time migration: fix EUR operations that were saved
            # with currency='CZK' (amount_company not converted).
            # The script is idempotent — safe to re-run.
            # ─────────────────────────────────────────────────────────
            if [ -f fix-eur-operations.js ]; then
              echo "[migration] Running EUR operations fix..."
              node fix-eur-operations.js --apply || echo "[migration] fix-eur-operations.js returned non-zero (non-fatal)"
            fi

            # Restart service only after a successful build.
            systemctl restart alisio-pms
            sleep 3

            # Verify the service actually came up.
            if ! systemctl is-active --quiet alisio-pms; then
              echo "Service failed to start after restart — rolling back"
              if [ -n "$PREVIOUS_COMMIT" ]; then
                git reset --hard "$PREVIOUS_COMMIT"
                npm ci --production=false
                npm run build
                systemctl restart alisio-pms
                echo "Rolled back to $PREVIOUS_COMMIT"
              fi
              exit 1
            fi

            echo "Deploy complete (was $PREVIOUS_COMMIT, now $NEW_COMMIT)"
            systemctl status alisio-pms --no-pager
