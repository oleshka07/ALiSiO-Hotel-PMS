name: Deploy ALiSiO PMS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GH_TOKEN
          script: |
            set -euo pipefail

            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/oleshka07/ALiSiO-Hotel-PMS.git"

            cd /root/projects

            # If no .git dir → fresh clone
            if [ ! -d "alisio-pms/.git" ]; then
              rm -rf alisio-pms
              git clone "$REPO_URL" alisio-pms
              cd alisio-pms
            else
              cd alisio-pms
              # Switch remote to new repo (in case it still points to old one)
              git remote set-url origin "$REPO_URL"
              PREVIOUS_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "")
              echo "Previous commit: $PREVIOUS_COMMIT"
              git fetch origin
              git reset --hard origin/main
            fi

            NEW_COMMIT=$(git rev-parse HEAD)
            echo "New commit: $NEW_COMMIT"

            # Ensure data dir exists (DB lives here, excluded from git)
            mkdir -p data

            # Install dependencies
            npm ci --production=false

            # Build Next.js. If this fails, abort before touching the running service.
            PREVIOUS_COMMIT=${PREVIOUS_COMMIT:-""}
            if ! npm run build; then
              echo "❌ Build failed — aborting deploy. Live service untouched."
              if [ -n "$PREVIOUS_COMMIT" ]; then
                echo "Rolling working tree back to $PREVIOUS_COMMIT"
                git reset --hard "$PREVIOUS_COMMIT"
              fi
              exit 1
            fi

            # Restart service only after a successful build.
            systemctl restart alisio-pms
            sleep 3

            # Verify the service actually came up.
            if ! systemctl is-active --quiet alisio-pms; then
              echo "❌ Service failed to start after restart — rolling back"
              if [ -n "$PREVIOUS_COMMIT" ]; then
                git reset --hard "$PREVIOUS_COMMIT"
                npm ci --production=false
                npm run build
                systemctl restart alisio-pms
                echo "↩  Rolled back to $PREVIOUS_COMMIT"
              fi
              exit 1
            fi

            echo "✅ Deploy complete (now $NEW_COMMIT)"
            systemctl status alisio-pms --no-pager
