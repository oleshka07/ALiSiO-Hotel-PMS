name: Deploy ALiSiO PMS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail

            cd /root/projects/alisio-pms

            PREVIOUS_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "")
            echo "Previous commit: $PREVIOUS_COMMIT"

            # Pull latest code
            if [ ! -d ".git" ]; then
              cd ..
              rm -rf alisio-pms
              git clone git@github.com:oleshka07/ALiSiO-Hotel-PMS.git alisio-pms
              cd alisio-pms
            else
              git fetch origin
              git reset --hard origin/main
            fi

            NEW_COMMIT=$(git rev-parse HEAD)
            echo "New commit:      $NEW_COMMIT"

            # Ensure data dir exists (DB lives here, excluded from git)
            mkdir -p data

            # Install dependencies
            npm ci --production=false

            # Build Next.js
            if ! npm run build; then
              echo "Build failed — aborting deploy. Live service untouched."
              if [ -n "$PREVIOUS_COMMIT" ]; then
                echo "Rolling working tree back to $PREVIOUS_COMMIT"
                git reset --hard "$PREVIOUS_COMMIT"
              fi
              exit 1
            fi

            # ─────────────────────────────────────────────────────────
            # Idempotent VPS setup for the bank-inbox cron endpoint
            # (PR #63). The endpoint /api/cron/poll-bank-inboxes
            # authenticates via process.env.CRON_SECRET. Generate
            # once + install crontab + create log file. All steps are
            # no-ops on subsequent runs.
            # ─────────────────────────────────────────────────────────
            if ! grep -q '^CRON_SECRET=' .env 2>/dev/null; then
              SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
              echo "CRON_SECRET=$SECRET" >> .env
              echo "[setup] generated CRON_SECRET and appended to .env"
            else
              echo "[setup] CRON_SECRET already present in .env"
            fi

            # Ensure the log file exists with the right perms so cron
            # output has somewhere to land.
            touch /var/log/pms-cron-bank.log
            chmod 644 /var/log/pms-cron-bank.log

            # Install crontab entry if not already present. We match
            # the URL path rather than the full command so future
            # tweaks (e.g. log rotation) don't double-install.
            if ! crontab -l 2>/dev/null | grep -q 'poll-bank-inboxes'; then
              ( crontab -l 2>/dev/null || true
                echo '*/15 * * * * curl -fsS -X POST -H "X-Cron-Secret: $(grep ^CRON_SECRET /root/projects/alisio-pms/.env | cut -d= -f2)" http://localhost:3000/api/cron/poll-bank-inboxes >> /var/log/pms-cron-bank.log 2>&1'
              ) | crontab -
              echo "[setup] installed crontab entry for poll-bank-inboxes"
            else
              echo "[setup] crontab entry for poll-bank-inboxes already present"
            fi

            # Restart service only after a successful build.
            systemctl restart alisio-pms
            sleep 3

            # Verify the service actually came up.
            if ! systemctl is-active --quiet alisio-pms; then
              echo "Service failed to start after restart — rolling back"
              if [ -n "$PREVIOUS_COMMIT" ]; then
                git reset --hard "$PREVIOUS_COMMIT"
                npm ci --production=false
                npm run build
                systemctl restart alisio-pms
                echo "Rolled back to $PREVIOUS_COMMIT"
              fi
              exit 1
            fi

            echo "Deploy complete (was $PREVIOUS_COMMIT, now $NEW_COMMIT)"
            systemctl status alisio-pms --no-pager
